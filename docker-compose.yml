services:
  app:
    build: .
    env_file: .env
    ports:
      - "${STOCKBOT_PORT:-8000}:8000"
    volumes:
      - stockbot_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  stockbot_data:
