name: Build and push to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert repository name to lowercase
        run: echo "GHCR_IMAGE_NAME=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Read application version
        run: echo "APP_VERSION=$(tr -d '[:space:]' < VERSION)" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build and push image to GHCR
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_GITHUB_REPOSITORY=${{ github.repository }}
            APP_GITHUB_DEFAULT_BRANCH=main
            APP_VERSION=${{ env.APP_VERSION }}
          tags: |
            ${{ env.GHCR_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.GHCR_IMAGE_NAME }}:${{ env.APP_VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.APP_VERSION }}
            version=${{ env.APP_VERSION }}
